<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
  <title>Successful order submission</title>
  <desc>A recreated order form success screen with an order reference and reset countdown.</desc>
  <rect width="1200" height="800" rx="28" fill="#F5F5F1"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#292F2B">
    <rect x="956" y="32" width="196" height="48" rx="24" fill="#FFF"/>
    <rect x="1021" y="37" width="60" height="38" rx="19" fill="#214C3E"/>
    <g font-size="13" font-weight="700" text-anchor="middle">
      <text x="990" y="62" fill="#77817A">ET</text>
      <text x="1051" y="62" fill="#FFF">EN</text>
      <text x="1117" y="62" fill="#77817A">RU</text>
    </g>
    <text x="600" y="151" text-anchor="middle" font-size="34" font-weight="800">PLACE AN ORDER</text>
    <text x="600" y="190" text-anchor="middle" font-size="17" fill="#77817A">Order waste removal or filling material in three simple steps.</text>
    <path d="M408 254H792" fill="none" stroke="#34765D" stroke-width="2"/>
    <g fill="#34765D">
      <circle cx="408" cy="254" r="21"/>
      <circle cx="600" cy="254" r="21"/>
    </g>
    <circle cx="792" cy="254" r="26" fill="#E1EAE3"/>
    <circle cx="792" cy="254" r="21" fill="#214C3E"/>
    <path d="m400 254 6 6 10-13m176 7 6 6 10-13" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="792" y="260" text-anchor="middle" font-size="16" fill="#FFF" font-weight="700">3</text>
    <rect x="104" y="310" width="992" height="80" rx="17" fill="#FAFAF7" stroke="#E3E7DF"/>
    <text x="130" y="358" font-size="17" font-weight="700">ORDER SUMMARY</text>
    <circle cx="1054" cy="350" r="21" fill="#FFF" stroke="#E3E7DF"/>
    <path d="m1049 347 5 6 5-6" fill="none" stroke="#77817A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="418" width="1080" height="326" rx="24" fill="#FFF"/>
    <circle cx="600" cy="510" r="42" fill="#E7F2E9"/>
    <circle cx="600" cy="510" r="33" fill="#34765D"/>
    <path d="m586 510 10 10 18-23" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="600" y="587" text-anchor="middle" font-size="22" font-weight="700">Thank you! Your order has been submitted successfully!</text>
    <text x="600" y="624" text-anchor="middle" font-size="17" fill="#626B65">Order number: <tspan fill="#292F2B" font-weight="700">T-000001</tspan></text>
    <text x="600" y="674" text-anchor="middle" font-size="15" fill="#77817A">A new order form will open in 9 seconds.</text>
    <rect x="475" y="692" width="250" height="4" rx="2" fill="#E3E7DF"/>
    <rect x="475" y="692" width="220" height="4" rx="2" fill="#34765D"/>
  </g>
</svg>
